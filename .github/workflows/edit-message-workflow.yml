name: Nodejs edit lark message

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request id from system"
        required: true
        type: string

      union_id:
        description: "Lark union_id used to find the assistant app"
        required: true
        type: string

      message_id:
        description: "Lark message_id to edit"
        required: true
        type: string

      title:
        description: "Message title"
        required: true
        type: string

      new_message_text:
        description: "New message content"
        required: true
        type: string

jobs:
  edit-message-lark:
    name: Edit Lark message - ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    environment: environment-production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run edit message
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UNION_ID: ${{ inputs.union_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          TITLE: ${{ inputs.title }}
          NEW_MESSAGE_TEXT: ${{ inputs.new_message_text }}
        run: node edit_message.js

  callback-job:
    name: Callback result
    needs: edit-message-lark
    if: always()
    runs-on: ubuntu-latest
    environment: environment-production

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          REQUEST_ID: ${{ inputs.request_id }}
          CONCLUSION: ${{ needs.edit-message-lark.result }}
          UNION_ID: ${{ inputs.union_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          TITLE: ${{ inputs.title }}
          NEW_MESSAGE_TEXT: ${{ inputs.new_message_text }}
        run: |
          jq -n \
            --arg request_id "$REQUEST_ID" \
            --arg job_id "edit-message-workflow.yml" \
            --arg conclusion "$CONCLUSION" \
            --arg type "edit" \
            --arg union_id "$UNION_ID" \
            --arg message_id "$MESSAGE_ID" \
            --arg title "$TITLE" \
            --arg new_message_text "$NEW_MESSAGE_TEXT" \
            '{
              request_id: $request_id,
              job_id: $job_id,
              conclusion: $conclusion,
              type: $type,
              receiver_id: $union_id,
              message_id: $message_id,
              title: $title,
              message_text: $new_message_text
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-
