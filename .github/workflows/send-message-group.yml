name: Nodejs send lark group message

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request id from system"
        required: true
        type: string

      CHAT_ID:
        description: "Lark chat_id (group)"
        required: true
        type: string

      MESSAGE_TEXT:
        description: "Message"
        required: true
        type: string
      
      TITLE:
        description: "Title"
        required: false
        type: string

jobs:
  send-group-lark:
    name: Lark group job - ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    environment: environment-production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run send group message
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          DB_CHAT_NAME: ${{ vars.DB_CHAT_NAME }}
          CHAT_ID: ${{ inputs.CHAT_ID }}
          MESSAGE_TEXT: ${{ inputs.MESSAGE_TEXT }}
          TITLE: ${{ inputs.TITLE }}
        run: node send_group.js

  # =========================
  # JOB CALLBACK: BẮN WEBHOOK
  # ========================= 
  callback-job:
    name: Callback result
    needs: send-group-lark
    if: always()
    runs-on: ubuntu-latest
    environment: environment-production

    steps:
      - name: Send callback to webhook
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
        run: |
          jq -n \
            --arg request_id "${{ inputs.request_id }}" \
            --arg job_id "send-group-workflow.yml" \
            --arg conclusion "${{ needs.send-group-lark.result }}" \
            --arg title "${{ inputs.TITLE }}" \
            --arg chat_id "${{ inputs.CHAT_ID }}" \
            --arg message_text "${{ inputs.MESSAGE_TEXT }}" \
            '{
              request_id: $request_id,
              job_id: $job_id,
              conclusion: $conclusion,
              title: $title,
              receiver_id: $chat_id,
              message_text: $message_text
            }' \
          | curl -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -d @-
