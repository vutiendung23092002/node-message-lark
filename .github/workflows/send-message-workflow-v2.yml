name: Nodejs send lark message

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique request id from Lark"
        required: true
        type: string

      OU_ID:
        description: "Open id"
        required: true
        type: string

      MESSAGE_TEXT:
        description: "Message"
        required: true
        type: string
      
      TITLE:
        description: "Title"
        required: false
        type: string

jobs:
  # =========================
  # JOB CHÍNH: CHẠY LOGIC
  # =========================
  send-message-lark:
    name: Lark job - ${{ inputs.request_id }}
    runs-on: ubuntu-latest
    environment: environment-production
    outputs:
      message_id: ${{ steps.send_message.outputs.message_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --only=production

      - name: Run send message
        id: send_message
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          AES_256_CBC_APP_SECRET_KEY: ${{ secrets.AES_256_CBC_APP_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OU_ID: ${{ inputs.OU_ID }}
          MESSAGE_TEXT: ${{ inputs.MESSAGE_TEXT }}
          TITLE: ${{ inputs.TITLE }}
        run: node send_dm.js

  # =========================
  # JOB CALLBACK: BẮN WEBHOOK
  # =========================
  callback-job:
   name: Callback result
   needs: send-message-lark
   if: always()
   runs-on: ubuntu-latest
   environment: environment-production
   
   steps:
     - name: Send callback to webhook
       env:
         CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
         REQUEST_ID: ${{ inputs.request_id }}
         CONCLUSION: ${{ needs.send-message-lark.result }}
         TITLE: ${{ inputs.TITLE }}
         RECEIVER_ID: ${{ inputs.OU_ID }}
         MESSAGE_TEXT: ${{ inputs.MESSAGE_TEXT }}
         MESSAGE_ID: ${{ needs.send-message-lark.outputs.message_id }}
       run: |
         jq -n \
           --arg request_id "$REQUEST_ID" \
           --arg job_id "send-message-workflow-v2.yml" \
           --arg conclusion "$CONCLUSION" \
           --arg type "send" \
           --arg title "$TITLE" \
           --arg ou_id "$RECEIVER_ID" \
           --arg message_text "$MESSAGE_TEXT" \
           --arg message_id "$MESSAGE_ID" \
           '{
             request_id: $request_id,
             job_id: $job_id,
             conclusion: $conclusion,
             type: $type,
             title: $title,
             receiver_id: $ou_id,
             message_text: $message_text,
             message_id: $message_id
           }' \
         | curl -X POST "$CALLBACK_URL" \
             -H "Content-Type: application/json" \
             -d @-
